<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UDAAN — Immersive 3D Adaptive Academic Navigator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Immersive 3D Learning Experience for UDAAN — 3D Galaxy, Interactive Math Lab, Learning Detective, Classroom Observatory, and Explainable BKT.">
<style>
:root{
  --bg:#07080A;--card:rgba(16, 17, 22, 0.85);--tx:#f8fafc;--mu:#94a3b8;
  --pr:#00f2fe;--pr-dark:#0284c7;--ac:#38bdf8;--wn:#fb923c;--er:#f43f5e;--ok:#10b981;
  --bd:rgba(0, 242, 254, 0.18);--shadow:0 12px 36px rgba(0,0,0,0.8);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#07080A;--card:rgba(16, 17, 22, 0.85);--tx:#f8fafc;--mu:#94a3b8;--bd:rgba(0, 242, 254, 0.18);
    --shadow:0 12px 36px rgba(0,0,0,0.8);
  }
}
[data-theme=light]{--bg:#07080A;--card:rgba(16, 17, 22, 0.85);--tx:#f8fafc;--mu:#94a3b8;--bd:rgba(0, 242, 254, 0.18)}
[data-theme=dark]{--bg:#07080A;--card:rgba(16, 17, 22, 0.85);--tx:#f8fafc;--mu:#94a3b8;--bd:rgba(0, 242, 254, 0.18)}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Telugu',sans-serif;
  background:var(--bg);color:var(--tx);
  background-image:radial-gradient(circle at 15% 0,rgba(91,75,255,0.18),transparent 45%),radial-gradient(circle at 90% 20%,rgba(0,184,169,0.18),transparent 45%);
  background-attachment:fixed;
}

/* Header & Navigation */
header{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 24px;position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bd);
}
.logo-box{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{font-weight:900;font-size:1.35rem;background:linear-gradient(90deg,var(--pr),var(--ac));-webkit-background-clip:text;color:transparent;letter-spacing:-0.5px}
.badge-tag{font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:12px;background:rgba(91,75,255,0.15);color:var(--pr)}
nav{display:flex;gap:6px;flex-wrap:wrap}

/* Buttons & Inputs */
button,select,input,textarea{font:inherit;color:inherit}
button{
  cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;
  padding:8px 14px;font-weight:600;transition:all .2s ease;display:inline-flex;align-items:center;gap:6px;
}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(91,75,255,0.2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--pr);outline-offset:2px
}
button.on,button.pri{
  background:linear-gradient(135deg,var(--pr),#8a4bff);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(91,75,255,0.3);
}
button.pri:hover{background:linear-gradient(135deg,var(--pr-dark),#793bee)}
button.sec{background:rgba(91,75,255,0.1);color:var(--pr);border-color:transparent}
button.danger{background:rgba(229,56,79,0.12);color:var(--er);border-color:transparent}
button.success{background:rgba(26,160,91,0.12);color:var(--ok);border-color:transparent}
button:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* Cards & Layout */
main{max-width:1120px;margin:auto;padding:16px 20px 80px}
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;
  margin:14px 0;animation:rise .45s both;box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}}

/* Hero Section */
.hero{
  display:grid;grid-template-columns:minmax(300px,1.4fr) minmax(220px,1fr);
  align-items:center;gap:24px;min-height:260px;perspective:1000px;
}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0 0 .25em;line-height:1.2;font-weight:900}
h2{font-size:1.35rem;margin:0 0 .4em;font-weight:800}
h3{font-size:1.1rem;margin:0 0 .3em;font-weight:700}
.mu{color:var(--mu);font-size:0.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spaced{justify-content:space-between}

/* 3D Cube & Stage */
.stage{height:220px;display:grid;place-items:center;perspective:800px;position:relative}
.cube{width:110px;height:110px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube div{
  position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:900;
  color:#fff;border:2px solid rgba(255,255,255,0.4);
  background:linear-gradient(135deg,rgba(91,75,255,0.85),rgba(0,184,169,0.85));
  backdrop-filter:blur(4px);border-radius:12px;user-select:none;box-shadow:inset 0 0 15px rgba(255,255,255,0.3);
}
.cube div:nth-child(1){transform:translateZ(55px)}
.cube div:nth-child(2){transform:rotateY(90deg) translateZ(55px)}
.cube div:nth-child(3){transform:rotateY(180deg) translateZ(55px)}
.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(55px)}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(55px)}
.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(55px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
.orb{
  position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.8),var(--pr));
  animation:flt 6s ease-in-out infinite;pointer-events:none;
}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

/* Progress & Bars */
.bar{height:12px;border-radius:8px;background:var(--bd);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac));border-radius:8px;transition:width 0.8s cubic-bezier(0.2,0.8,0.2,1)}

/* Badges & Tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:700;background:rgba(91,75,255,0.12);color:var(--pr);margin:2px}
.tag.warn{background:rgba(255,138,61,0.15);color:var(--wn)}
.tag.good{background:rgba(26,160,91,0.15);color:var(--ok)}
.tag.danger{background:rgba(229,56,79,0.15);color:var(--er)}
.tag.sample{border:1px dashed var(--wn)}

/* Options & Question choices */
.opt{
  display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;
  background:var(--card);border:1.5px solid var(--bd);border-radius:12px;font-size:1rem;
}
.opt:hover{border-color:var(--pr);background:rgba(91,75,255,0.04)}
.opt.right{border-color:var(--ok);background:rgba(26,160,91,0.15);font-weight:700}
.opt.wrong{border-color:var(--er);background:rgba(229,56,79,0.15);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Form controls */
input,textarea,select{
  padding:10px 12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);width:100%;
}
input[type=range]{padding:0;accent-color:var(--pr)}
label{display:block;margin:8px 0;font-weight:600;font-size:0.92rem}

/* Modals & Dialogs */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);display:grid;place-items:center;
  z-index:200;padding:16px;backdrop-filter:blur(4px);
}
.modal-content{
  background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;
  max-width:540px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.3);max-height:90vh;overflow-y:auto;
}

/* Tables */
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:.9rem}
th{font-weight:700;color:var(--mu)}

/* Visual number line */
.number-line{
  position:relative;height:50px;margin:20px 0;border-bottom:2px solid var(--tx);
  display:flex;justify-content:space-between;padding:0 10px;
}
.nl-point{position:relative;text-align:center}
.nl-point::after{content:'';position:absolute;bottom:-6px;left:50%;width:2px;height:10px;background:var(--tx)}
.nl-jump{
  position:absolute;height:24px;border:2px dashed var(--ac);border-bottom:none;
  border-radius:24px 24px 0 0;top:-10px;display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;font-weight:700;color:var(--ac);
}

/* Confetti */
.conf{position:fixed;inset:0;pointer-events:none;z-index:999}
.conf b{position:absolute;top:-10px;width:10px;height:14px;border-radius:3px;animation:fall 2.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="logo-box">
    <span class="logo" style="background: linear-gradient(110deg, #00f2fe 0%, #38bdf8 45%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">✈ UDAAN</span>

<main id="app" role="main"></main>

<script>
// --- I18N DICTIONARY ---

    sub: 'ఇంటరాక్టివ్ 3D అభ్యాస విశ్వం, భిన్నాల మ్యాథ్ ల్యాబ్ మరియు ఉపాధ్యాయ యాక్షన్ కార్డులు.',

    offline: '○ ఆఫ్‌లైన్ (క్యూలో దాచబడింది)',
    mastery: 'భావన నైపుణ్యం స్థితి',
    start: 'లెర్నింగ్ డిటెక్టివ్ ప్రారంభించు',
    next: 'తదుపరి',
    sync: 'సింక్ క్యూ',
    role: 'పాత్ర'
  }
};

// --- APPLICATION STATE ---
const S = {
  lang: 'en',
  tab: 'student',
  role: 'student',
  online: true,
  is3DMode: true,
  labStep: 1,
  labSubdivided: false,
  labReducedMotion: false,
  labPracticeAns: null,
  selectedGalaxyPlanet: null,
  selectedStudentNode: null,
  teacherViewMode: 'cards',

  cfg: {
    up: 2,
    down: 2,
    help: 3,
    thr: 30,
    p0: 0.30,
    transition: 0.15,
    slip: 0.10,
    guess: 0.25
  },

  concepts: [
    { id: 'c0', en: 'Integers & Directed Numbers', te: 'పూర్ణాంకాలు & సంఖ్యా రేఖ', prereq: null },
    { id: 'c1', en: 'Fractions & Equivalent Forms', te: 'భిన్నాలు & సమాన రూపాలు', prereq: 'c0' },
    { id: 'c2', en: 'LCM & Common Denominators', te: 'క.సా.గు & ఉమ్మడి హారాలు', prereq: 'c1' },
    { id: 'c3', en: 'Rational Meaning (p/q, q≠0)', te: 'అకరణీయ సంఖ్యల నిర్వచనం', prereq: 'c1' },
    { id: 'c4', en: 'Comparing Rational Numbers', te: 'అకరణీయ సంఖ్యల పోలిక', prereq: 'c3' },
    { id: 'c5', en: 'Adding Rationals (Unlike Denominators)', te: 'వేర్వేరు హారాలు గల కూడిక', prereq: 'c2' },
    { id: 'c6', en: 'Multiplication & Division of Rationals', te: 'గుణకారం & భాగహారం', prereq: 'c5' }
  ],

  planets: [
    { id: 'c0', name_en: 'Integers & Directed Numbers', name_te: 'పూర్ణాంకాలు & సంఖ్యా రేఖ', prereq: null, color: '#5b4bff', x: 15, y: 50, size: 28 },
    { id: 'c1', name_en: 'Fractions & Equivalent Forms', name_te: 'భిన్నాలు & సమాన రూపాలు', prereq: 'c0', color: '#3b82f6', x: 35, y: 25, size: 30 },
    { id: 'c2', name_en: 'LCM & Common Denominators', name_te: 'క.సా.గు & ఉమ్మడి హారాలు', prereq: 'c1', color: '#00b8a9', x: 55, y: 65, size: 32 },
    { id: 'c5', name_en: 'Rational Numbers & Addition', name_te: 'అకరణీయ సంఖ్యలు & కూడిక', prereq: 'c2', color: '#8a4bff', x: 75, y: 35, size: 34 },
    { id: 'c7', name_en: 'Algebra & Rational Expressions', name_te: 'బీజగణితం & అకరణీయ సమాసాలు', prereq: 'c5', color: '#ff8a3d', x: 90, y: 70, size: 30 }
  ],

  m: { c0: 0.80, c1: 0.50, c2: 0.40, c3: 0.60, c4: 0.30, c5: 0.25, c6: 0.10 },
  ruleState: { c5: { lvl: 1, sc: 0, sw: 0, path: 'Focused practice', reason: 'Baseline initialized' } },
  bktState: { c5: { p: 0.25, hist: [] } },
  hist: [],
  queue: [],
  syncedServerIds: new Set(),
  det: null,

  cards: [
    {
      id: 101,
      student: 'Sample Cohort Aggregate (n=40)',
      concept: 'Adding Rationals (Unlike Denominators)',
      obs: '38% of 40 sample students chose “Added numerators and denominators separately” (-1/3). Follow-ups confirmed it.',
      rule: 'Misconception prevalence ≥ teacher threshold (30%)',
      act: 'Conduct 15-min tactile fraction manipulative lesson; assign LCM number-line exercises.',
      reassess: 'pending',
      st: 'pending',
      sample: true
    }
  ],

  qs: [
    {
      id: 'Q1',
      concept: 'c5',
      stem_en: '(-3/4) + (1/2) = ?',
      stem_te: '(-3/4) + (1/2) = ?',
      diff: 2,
      opts: [
        { text: '-1/4', correct: true, tag: null, exp_en: 'Correct. (-3/4) + (2/4) = -1/4.', exp_te: 'సరైనది.' },
        { text: '-1/3', correct: false, tag: 'num_den_separate', exp_en: 'Added tops and bottoms: (-3+1)/(4+2) = -2/6 = -1/3.', exp_te: 'లవాలు మరియు హారాలను విడివిడిగా కూడారు.' },
        { text: '5/4', correct: false, tag: 'ignored_negative', exp_en: 'Ignored negative sign: 3/4 + 2/4 = 5/4.', exp_te: 'రుణ గుర్తును విస్మరించారు.' },
        { text: '1/4', correct: false, tag: 'sign_slip', exp_en: 'Sign error in final sum (+1/4 instead of -1/4).', exp_te: 'గుర్తు గణనలో పొరపాటు.' }
      ],
      hint_en: 'Find the LCM of 4 and 2 before adding.',
      hint_te: 'కూడే ముందు 4 మరియు 2 ల క.సా.గు కనుగొనండి.',
      sol_en: '1/2 = 2/4. (-3/4) + (2/4) = (-3 + 2)/4 = -1/4.',
      sol_te: '1/2 = 2/4. (-3/4) + (2/4) = (-3 + 2)/4 = -1/4.',
      st: 'published',
      v: [{ v: 1, note: 'Initial reviewed curriculum seed', date: '2026-10-20' }]
    }
  ],
  practiceIdx: 0
};

const t = k => (T[S.lang] && T[S.lang][k]) || k;
const $ = s => document.querySelector(s);

// --- BKT MATHEMATICAL ENGINE ---
function bktUpdate(p, isCorrect) {
  const cfg = S.cfg;
  const pSafe = Math.max(0.001, Math.min(0.999, p));
  let post;
  if (isCorrect) {
    const num = pSafe * (1 - cfg.slip);
    const den = num + (1 - pSafe) * cfg.guess;
    post = num / Math.max(1e-9, den);
  } else {
    const num = pSafe * cfg.slip;
    const den = num + (1 - pSafe) * (1 - cfg.guess);
    post = num / Math.max(1e-9, den);
  }
  return Math.max(0.001, Math.min(0.999, post + (1 - post) * cfg.transition));
}

function getMasteryBand(p) {
  if (p < 0.20) return 'Novice / Not Started';
  if (p < 0.50) return 'Building Foundation';
  if (p < 0.85) return 'Developing Competence';
  return 'Secure / Ready for Challenge';
}

function recordAttempt(cid, isCorrect, hintsUsed = 0, source = 'practice', isReassessment = false) {
  const id = 'att_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  S.queue.push({ id, cid, isCorrect, ts: Date.now() });

  if (!S.bktState[cid]) S.bktState[cid] = { p: S.m[cid] || 0.3, hist: [] };
  const bState = S.bktState[cid];
  const oldP = bState.p;
  bState.p = bktUpdate(oldP, isCorrect);
  S.m[cid] = bState.p;
  bState.hist.push({
    isCorrect,
    oldP: Math.round(oldP * 100),
    newP: Math.round(bState.p * 100),
    time: new Date().toLocaleTimeString()
  });

  if (!S.ruleState[cid]) S.ruleState[cid] = { lvl: 1, sc: 0, sw: 0, path: 'Focused practice', reason: 'Initialized' };
  const r = S.ruleState[cid];
  if (isCorrect) { r.sc++; r.sw = 0; } else { r.sw++; r.sc = 0; }

  let path, why;
  const cfg = S.cfg;
  if (isReassessment && isCorrect) {
    path = 'Progression - Recovery Verified';
    why = 'Fresh reassessment answered correctly after targeted support.';
  } else if (isReassessment && !isCorrect) {
    path = 'Request teacher help';
    why = 'Persistent difficulty: Fresh reassessment failed.';
    r.lvl = Math.max(1, r.lvl - 1);
  } else if (r.sw >= cfg.help) {
    path = 'Request teacher help';
    why = `${r.sw} wrong answers in a row met help threshold (${cfg.help}).`;
    r.lvl = Math.max(1, r.lvl - 1);
  } else if (r.sw >= cfg.down || hintsUsed >= 2) {
    path = 'Revisit prerequisite';
    why = r.sw >= cfg.down ? `Wrong streak (${r.sw}) reached prerequisite threshold (${cfg.down}).` : `Heavy hints requested (${hintsUsed}).`;
    r.lvl = Math.max(1, r.lvl - 1);
  } else if (r.sc >= cfg.up) {
    path = 'Harder questions';
    why = `${r.sc} correct answers reached advancement threshold (${cfg.up}).`;
    r.lvl = Math.min(3, r.lvl + 1);
  } else {
    path = 'Focused practice';
    why = isCorrect ? `Correct answer logged (${r.sc}/${cfg.up} to advance).` : `Single error logged (${r.sw}/${cfg.down} to prerequisite).`;
  }

  r.path = path;
  r.reason = why;
  S.hist.unshift(`${new Date().toLocaleTimeString()} · [${cid}] ${isCorrect ? '✓' : '✗'} → ${path}`);
}

function burstConfetti() {
  const c = document.createElement('div');
  c.className = 'conf';
  for (let i = 0; i < 50; i++) {
    const b = document.createElement('b');
    b.style.cssText = `left:${Math.random()*100}%;background:hsl(${Math.random()*360},85%,60%);animation-delay:${Math.random()*0.5}s`;
    c.appendChild(b);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 3200);
}

  } else if (d.step === 'done') {
    html += `
      <div style="background:rgba(26,160,91,0.15);padding:14px;border-radius:12px;text-align:center">
        <h3>🎉 Case Closed: Recovery Verified!</h3>
      </div>
    `;
  }

  return html + '</div>';
}

function detStart() {
  S.det = { step: 'solve', q: S.qs[0], picked: null, tag: null, hypothesis: null };
  render();
}

function detPickPrimary(idx) {
  const opt = S.det.q.opts[idx];
  recordAttempt('c5', opt.correct, 0, 'detective_primary');
  if (opt.correct) {
    S.det.step = 'done';
    burstConfetti();
  } else {
    S.det.step = 'confirm';
    S.det.tag = opt.tag;
    S.det.hypothesis = `Hypothesis: exhibited '${opt.tag}'. Preliminary evidence.`;
  }
  render();
}

function detSubmitFollowup(isOk) {
  recordAttempt('c5', isOk, 0, 'detective_followup');
  S.det.step = isOk ? 'retry_slip' : 'support';
  render();
}

function detSubmitReassessment(isOk) {
  recordAttempt('c5', isOk, 0, 'detective_reassessment', true);
  if (isOk) {
    S.det.step = 'done';
    burstConfetti();
  } else {
    S.det.step = 'persistent';
    S.cards.unshift({
      id: Date.now(),
      student: 'Demo Student (Aarav Sharma)',
      concept: 'Adding Rationals',
      obs: 'Failed follow-up and reassessment on adding unlike rationals.',
      rule: 'Reassessment failed after targeted intervention',
      act: 'Small group manipulative review on finding LCM.',
      reassess: 'failed',
      st: 'pending',
      sample: false
    });
  }
  render();
}

// --- TEACHER VIEW ---
function viewTeacher() {
  return `
  <div class="card">
    <div class="row spaced">
      <div>
        <h2>Teacher Command Center</h2>
        <span class="tag warn sample">SAMPLE COHORT (n=40)</span>
      </div>
      <div class="row">
        <button class="${S.teacherViewMode==='cards'?'pri':'sec'}" onclick="S.teacherViewMode='cards';render()">📋 Action Cards</button>
        <button class="${S.teacherViewMode==='observatory'?'pri':'sec'}" onclick="S.teacherViewMode='observatory';render()">🔭 Classroom Observatory</button>
      </div>
    </div>

    ${S.teacherViewMode === 'observatory' ? `
      <!-- Observatory Constellation -->
      <div style="margin-top:16px">
        <h3>🔭 Visual Classroom Observatory</h3>
        <p class="mu">Student constellation grouped by intervention priority. Click to inspect.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:14px;background:var(--bg);border-radius:12px">
          ${[
            ['Aarav Sharma', 'var(--er)', '0.25', 'num_den_separate'],
            ['Diya Patel', 'var(--er)', '0.28', 'num_den_separate'],
            ['Rohan Verma', 'var(--wn)', '0.42', 'ignored_negative'],
            ['Ananya Reddy', 'var(--ok)', '0.88', 'none'],
            ['Vihaan Rao', 'var(--ok)', '0.92', 'none']
          ].map(([name, color, score, tag]) => `
            <div onclick="alert('Student: ${name}\\nMastery: ${score}\\nMisconception: ${tag}\\nAction: Scheduled for intervention.')" style="padding:10px;border-radius:10px;background:var(--card);border:2px solid ${color};text-align:center;cursor:pointer">
              <div style="width:32px;height:32px;border-radius:50%;background:${color}22;color:${color};display:grid;place-items:center;font-weight:800;margin:auto">${name[0]}</div>
              <b style="font-size:0.8rem;display:block;margin-top:4px">${name.split(' ')[0]}</b>
              <span class="mu" style="font-size:0.7rem">${score} BKT</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : `
      <!-- Action Cards -->
      <div style="margin-top:16px">
        ${S.cards.map(c => `
          <div class="card" style="border-left:5px solid ${c.st==='completed'?'var(--ok)':(c.st==='dismissed'?'var(--mu)':'var(--pr)')}">
            <div class="row spaced">
              <b>${c.student}</b>
              <span class="tag ${c.st==='accepted'?'good':'warn'}">${c.st.toUpperCase()}</span>
            </div>
            <p style="margin:6px 0;font-size:0.9rem">${c.obs}</p>
            <div class="mu" style="font-size:0.85rem">Suggested Action: <b>${c.act}</b></div>
            <div class="row" style="margin-top:10px">
              ${c.st === 'pending' ? `
                <button class="pri" onclick="cardAction(${c.id}, 'accepted')">✓ Accept</button>
                <button class="danger" onclick="cardAction(${c.id}, 'dismissed')">✗ Dismiss</button>
              ` : `
                <button class="sec" onclick="cardAction(${c.id}, 'completed')">Mark Completed</button>
              `}
            </div>
          </div>
        `).join('')}
      </div>
    `}
  </div>
  `;
}

function cardAction(id, st) {
  const c = S.cards.find(x => x.id === id);
  if (c) { c.st = st; render(); }
}

// --- CONTENT AUTHORING VIEW ---
function viewContent() {
  return `
  <div class="card">
    <h2>Question Authoring & Review Workflow</h2>
    <p class="mu">Draft → Reviewed → Published state machine with strict bilingual validation gates.</p>
    ${S.qs.map((q, qi) => `
      <div class="card">
        <div class="row spaced">
          <b>${q.id}</b>
          <span class="tag ${q.st==='published'?'good':'warn'}">${q.st.toUpperCase()}</span>
        </div>
        <p><b>Stem:</b> ${q.stem_en}</p>
        <div class="row">
          <button class="pri" onclick="advanceQ(${qi})">Advance: draft→reviewed→published</button>
        </div>
      </div>
    `).join('')}
  </div>
  `;
}

function advanceQ(qi) {
  const q = S.qs[qi];
  q.st = q.st === 'draft' ? 'reviewed' : 'published';
  render();
}

// --- MODEL COMPARISON VIEW ---
function viewCompare() {
  const cases = [
    ['✓✓✗✓✓', 1], ['✗✗✓✗✗', 0], ['✗✓✓✓✓', 1], ['✓✗✗✗✓', 0],
    ['✗✗✗✓✓', 1], ['✓✓✓✗✗', 0], ['✗✗✓✓✗', 0], ['✓✗✓✓✓', 1]
  ];
  let rOk = 0, bOk = 0;
  const rows = cases.map(([seq, lab], i) => {
    let sc = 0, p = S.cfg.p0;
    for (const ch of seq) {
      if (ch === '✓') { sc++; p = bktUpdate(p, true); }
      else { sc = 0; p = bktUpdate(p, false); }
    }
    const rPred = sc >= 2 ? 1 : 0;
    const bPred = p >= 0.85 ? 1 : 0;
    if (rPred === lab) rOk++;
    if (bPred === lab) bOk++;
    return `<tr><td>#${i+1}</td><td><code>${seq}</code></td><td>${lab?'Mastered':'Not yet'}</td><td>${rPred?'Mastered':'Not yet'}</td><td>${bPred?'Mastered':'Not yet'} (${Math.round(p*100)}%)</td></tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>Rule Baseline vs. BKT-Inspired Comparison</h2>
    <span class="tag warn sample">8 SYNTHETIC BENCHMARK CASES</span>
    <table>
      <thead><tr><th>ID</th><th>Sequence</th><th>Teacher Ground Truth</th><th>Rule Model</th><th>BKT Model</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p>Agreement: Rules ${rOk}/8 · BKT ${bOk}/8</p>
    <p class="mu">Scientific notice: Neither model is superior based on synthetic data. Real pilots required for clinical validity.</p>
  </div>
  `;
}

function viewAbout() {
  return `
  <div class="card">
    <h2>System Architecture & Verified Status</h2>
    <p class="mu">Complete integration: 3D Galaxy, Math Lab, Learning Detective, Classroom Observatory, and Explainable Rules.</p>
  </div>
  `;
}

// --- APP ROUTING & BOOT ---
const VIEWS = {
  student: viewStudent,
  galaxy: viewGalaxy,
  mathLab: viewMathLab,
  detective: viewDetective,
  teacher: viewTeacher,
  content: viewContent,
  compare: viewCompare,
  about: viewAbout
};

function go(tab) {
  S.tab = tab;
  render();
}

function render() {
  $('#nav').innerHTML = Object.keys(VIEWS).map(k => `
    <button class="${S.tab === k ? 'on' : ''}" role="tab" aria-selected="${S.tab === k}" onclick="go('${k}')">
      ${t(k)}
    </button>
  `).join('');

  $('#net-btn').textContent = S.online ? t('online') : t('offline');
  $('#net-btn').className = S.online ? 'success' : 'warn';
  $('#lng-btn').textContent = S.lang === 'en' ? 'తెలుగు' : 'English';
  $('#role-btn').textContent = `Role: ${S.role.charAt(0).toUpperCase() + S.role.slice(1)}`;

  $('#app').innerHTML = VIEWS[S.tab]();
  document.documentElement.lang = S.lang;
}

$('#net-btn').onclick = () => { S.online = !S.online; render(); };
$('#lng-btn').onclick = () => { S.lang = S.lang === 'en' ? 'te' : 'en'; render(); };
$('#role-btn').onclick = () => {
  const roles = ['student', 'teacher', 'author'];
  S.role = roles[(roles.indexOf(S.role) + 1) % roles.length];
  if (S.role === 'teacher') S.tab = 'teacher';
  else if (S.role === 'author') S.tab = 'content';
  else S.tab = 'student';
  render();
};

render();
</script>
</body>
</html>
